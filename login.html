<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Seraphina Author</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mencegah scrollbar agar posisi layout stabil */
        html {
            scrollbar-width: none;
        }
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* HERO SECTION LOGIN DENGAN VIDEO DI BAWAH NAVBAR */
        .login-hero {
            position: relative;
            height: calc(100vh - 70px); /* Menyesuaikan tinggi layar dikurangi tinggi navbar */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Video Background */
        .login-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Lapisan Gelap Transparan di atas Video */
        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(20,0,30,0.6));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* KOTAK GLASSMORPHISM (KACA BURAM ESTETIK) */
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            color: white;
            z-index: 2;
        }

        .login-card h2 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #eee;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .form-group input:focus {
            border-color: #ff3366;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
        }

        .btn-submit {
            width: 100%;
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background-color: #ff1a53;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.7);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="hamburger" onclick="toggleSidebar()">&#9776;</div>
                <div class="logo">
                    <a href="index.html">SERAPHINA <span>AUTHOR</span></a>
                </div>
            </div>
            <div class="nav-right" style="display: flex; gap: 10px; align-items: center;">
                <a href="login.html" class="btn-login" style="background-color: #ff3366; color: white;">LOGIN</a>
                <a href="https://wattpad.com" target="_blank" class="btn-wattpad">WATTPAD PROFILE</a>
            </div>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        <ul class="sidebar-menu">
            <li><a href="index.html" onclick="toggleSidebar()">HOME</a></li>
            <li><a href="chapters.html" onclick="toggleSidebar()">CHAPTERS</a></li>
            <li><a href="character.html" onclick="toggleSidebar()">CHARACTER</a></li>
            <li><a href="soundtrack.html" onclick="toggleSidebar()">SOUNDTRACK</a></li>
            <li><a href="stories.html" onclick="toggleSidebar()">STORIES</a></li>
            <li><a href="login.html" onclick="toggleSidebar()">LOGIN</a></li>
        </ul>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <section class="login-hero">
        <video autoplay loop muted playsinline class="login-video">
            <source src="bg.mp4" type="video/mp4">
        </video>

        <div class="login-overlay">
            <div class="login-card">
                <h2>MEMBER LOGIN</h2>
                <form action="index.html">
                    <div class="form-group">
                        <label>Email atau Username</label>
                        <input type="text" placeholder="Masukkan email kamu..." required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Masukkan password..." required>
                    </div>
                    <button type="submit" class="btn-submit">MASUK</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById("mySidebar");
            sidebar.classList.toggle("active");
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
