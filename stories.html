<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories - Seraphina Author</title>
    
    <!-- Import Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="stories.css">
</head>
<body>

    <!-- ================= NAVBAR / HEADER ATAS ================= -->
    <header class="navbar">
        <div class="header-left">
            <button class="menu-btn" id="open-menu" aria-label="Buka Menu">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html" class="logo">
                <span class="logo-black">SERAPHINA</span>
                <span class="logo-pink">AUTHOR</span>
            </a>
        </div>
        <div class="header-right">
            <a href="login.html" class="btn-login">LOGIN</a>
            <a href="https://wattpad.com" target="_blank" class="btn-wattpad">WATTPAD PROFILE</a>
        </div>
    </header>

    <!-- ================= MENU TAB SIDEBAR ================= -->
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="close-menu" aria-label="Tutup Menu">&times;</button>
        <nav class="sidebar-nav">
            <a href="index.html">HOME</a>
            <a href="chapters.html">CHAPTERS</a>
            <a href="character.html">CHARACTER</a>
            <a href="stories.html" class="active">STORIES</a>
            <a href="soundtrack.html">SOUNDTRACK</a>
            <a href="login.html">LOGIN</a>
        </nav>
    </aside>

    <!-- ================= KONTEN UTAMA PAGE STORIES ================= -->
    <main class="container">
        <!-- Bagian Judul -->
        <section class="page-title">
            <span class="subtitle">DAFTAR LENGKAP</span>
            <h1>Koleksi <span class="highlight">Cerita</span></h1>
            <p class="breadcrumb">Home > <span class="highlight">Stories</span></p>
        </section>

        <!-- Tombol Filter / Kategori (Sesuai Referensi) -->
        <div class="filter-tabs">
            <button class="filter-btn active">Semua Cerita</button>
            <button class="filter-btn">Fiction</button>
            <button class="filter-btn">Mystery</button>
            <button class="filter-btn">Family</button>
        </div>

        <!-- Grid Kartu Cerita -->
        <section class="grid-stories">
            
            <!-- Kartu 1 -->
            <a href="#" class="story-card">
                <div class="card-frame">
                    <img src="https://img.wattpad.com/cover/394525898-256-k178743.jpg" alt="Kilau dan Debu S1">
                </div>
                <h2>Kilau dan Debu S1</h2>
            </a>

            <!-- Kartu 2 -->
            <a href="#" class="story-card">
                <div class="card-frame">
                    <img src="https://img.wattpad.com/cover/401249977-256-k463182.jpg" alt="Kilau dan Debu S2">
                </div>
                <h2>Kilau dan Debu S2</h2>
            </a>

            <!-- Kartu 3 -->
            <a href="#" class="story-card">
                <div class="card-frame">
                    <img src="https://img.wattpad.com/cover/413327092-256-k207704.jpg" alt="Rema dan Hening">
                </div>
                <h2>Rema dan Hening</h2>
            </a>

            <!-- Kartu 4 -->
            <a href="#" class="story-card">
                <div class="card-frame">
                    <img src="https://img.wattpad.com/cover/369024668-144-k733812.jpg" alt="The Two Never Get Along">
                </div>
                <h2>The Two Never Get Along</h2>
            </a>

        </section>
    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const openMenuBtn = document.getElementById('open-menu');
        const closeMenuBtn = document.getElementById('close-menu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function openSidebar() {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        if(openMenuBtn) openMenuBtn.addEventListener('click', openSidebar);
        if(closeMenuBtn) closeMenuBtn.addEventListener('click', closeSidebar);
        if(overlay) overlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
